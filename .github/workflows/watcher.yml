name: dca-watcher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Poner 1 para enviar un mensaje de PRUEBA a Telegram"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar vigilante
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ github.event.inputs.test }}
        run: python watcher.py

      - name: Guardar estado (evita alertas repetidas)
        run: |
          git config user.name "dca-bot"
          git config user.email "dca-bot@users.noreply.github.com"
          git add estado.json || true
          git commit -m "actualiza estado" || echo "sin cambios"
          git push || echo "nada que subir"
