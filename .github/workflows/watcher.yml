name: dca-watcher

# Ejecuta el vigilante cada 30 minutos y guarda el estado para no repetir alertas
on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min (UTC). Cambia si quieres otra frecuencia
  workflow_dispatch: {}       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write             # para poder guardar estado.json

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar vigilante
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Guardar estado (evita alertas repetidas)
        run: |
          git config user.name "dca-bot"
          git config user.email "dca-bot@users.noreply.github.com"
          git add estado.json || true
          git commit -m "actualiza estado" || echo "sin cambios"
          git push || echo "nada que subir"
